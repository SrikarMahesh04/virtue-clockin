name: application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clockin_ci:isolated-test-only@127.0.0.1:5432/virtue_clockin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Native PostgreSQL test database (no Docker required)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE clockin_ci WITH LOGIN PASSWORD 'isolated-test-only';"
          sudo -u postgres createdb -O clockin_ci virtue_clockin_test
      - name: Backend install and checks
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run pytest -q
      - name: Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Contract drift
        run: |
          backend/.venv/bin/python scripts/export_contract.py --check
          cd frontend
          pnpm contracts
          pnpm exec prettier --write src/generated/schema.d.ts
          git diff --exit-code -- src/generated/schema.d.ts
      - name: Frontend checks
        working-directory: frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
